name: Daily MDM Spec Audit

on:
  schedule:
    # 06:00 UTC daily = 10:00 AM UAE/KSA (UTC+4). Adjust the hour to taste —
    # GitHub's cron can run a few minutes late, that's normal.
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # adds a "Run workflow" button in the Actions tab for manual runs

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Google service account key
        run: echo '${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}' > service_account.json

      - name: Run today's audit batch
        id: run_audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GDRIVE_SERVICE_ACCOUNT_FILE: service_account.json
          GDRIVE_ROOT_FOLDER_ID: ${{ secrets.GDRIVE_ROOT_FOLDER_ID }}
          GDRIVE_BROCHURES_FOLDER_ID: ${{ secrets.GDRIVE_BROCHURES_FOLDER_ID }}
          DAILY_REQUEST_CAP: ${{ vars.DAILY_REQUEST_CAP }}
          RATE_LIMIT_RPM: ${{ vars.RATE_LIMIT_RPM }}
        run: python run_daily_audit.py

      - name: Remove credentials
        if: always()
        run: rm -f service_account.json

      - name: Upload run logs as a build artifact (backup / debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-run-data
          path: run_data/
          retention-days: 14

      # ---- Email report -----------------------------------------------------
      # Runs regardless of whether the audit step succeeded, hit the daily
      # cap, or crashed, so you always get a result in your inbox instead of
      # having to check the Actions tab.
      - name: Build email body
        if: always()
        run: |
          if [ "${{ steps.run_audit.outcome }}" = "success" ]; then
            echo "STATUS_LINE=MDM Audit run completed" >> "$GITHUB_ENV"
          else
            echo "STATUS_LINE=MDM Audit run FAILED (outcome: ${{ steps.run_audit.outcome }})" >> "$GITHUB_ENV"
          fi
          {
            echo "EMAIL_BODY<<EOF"
            if [ -f run_data/audit_summary.txt ]; then
              cat run_data/audit_summary.txt
            else
              echo "No audit_summary.txt was produced — the run likely failed before reaching"
              echo "the summary step. Check the workflow run log and the uploaded"
              echo "'audit-run-data' artifact for details."
            fi
            echo ""
            echo "----"
            echo "Full log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Send email report
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ vars.MAIL_SERVER || 'smtp.gmail.com' }}
          server_port: ${{ vars.MAIL_PORT || 465 }}
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: ${{ secrets.MAIL_TO }}
          subject: "${{ env.STATUS_LINE }} — ${{ github.repository }}"
          body: ${{ env.EMAIL_BODY }}
